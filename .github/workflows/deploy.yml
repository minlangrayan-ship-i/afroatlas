name: Verify and publish AfroAtlas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: afroatlas-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run check:backend
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          # Custom domain, e.g. https://afroatlas.org/ (empty: the github.io project URL).
          SITE_URL: ${{ vars.SITE_URL }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_USAGE_METRICS_ENABLED: ${{ vars.PUBLIC_USAGE_METRICS_ENABLED }}
      - run: npm run check:publication
      - run: node scripts/check-output.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.HOSTING_PROVIDER != 'cloudflare'
        with:
          path: dist
  verify-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
        env:
          # Test-only URL. This job never publishes a Cloudflare site.
          SITE_URL: https://afroatlas-build-check.pages.dev/afroatlas/
          ASTRO_TELEMETRY_DISABLED: '1'
      - run: npm run check:cloudflare
  deploy:
    if: github.event_name != 'pull_request' && vars.HOSTING_PROVIDER != 'cloudflare' && (github.event.repository.private == false || vars.PRIVATE_GITHUB_PAGES_SUPPORTED == 'true')
    needs: [build, verify-cloudflare]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
